<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-label="Comparaison detaillee puce NFC tag versus puce de paiement EMV">
  <rect width="1000" height="820" fill="#f7f9fb"/>

  <!-- ========== LEFT: NFC TAG ========== -->
  <g>
    <rect x="24" y="16" width="452" height="520" rx="12" fill="#fff" stroke="#c5d3df" stroke-width="2"/>
    <rect x="24" y="16" width="452" height="44" rx="12" fill="#e7f6f3"/>
    <rect x="24" y="44" width="452" height="16" fill="#e7f6f3"/>
    <text x="250" y="44" text-anchor="middle" fill="#087a6a" font-family="Syne,sans-serif" font-size="17" font-weight="800">Tag NFC (Type 2)</text>

    <text x="250" y="82" text-anchor="middle" fill="#5a6b7c" font-size="11" font-weight="700" letter-spacing="0.05em">VUE PHYSIQUE (inlay + coupe)</text>

    <!-- Sticker -->
    <rect x="40" y="94" width="200" height="140" rx="8" fill="#f7f9fb" stroke="#c5d3df" stroke-width="2"/>
    <ellipse cx="140" cy="155" rx="70" ry="46" fill="none" stroke="#0d9f8a" stroke-width="3.5"/>
    <ellipse cx="140" cy="155" rx="52" ry="33" fill="none" stroke="#0d9f8a" stroke-width="2.5"/>
    <ellipse cx="140" cy="155" rx="34" ry="20" fill="none" stroke="#0d9f8a" stroke-width="2"/>
    <!-- die on white pad -->
    <rect x="118" y="139" width="44" height="32" rx="2" fill="#fff" stroke="#0c1b2a" stroke-width="1.5"/>
    <rect x="124" y="145" width="32" height="20" rx="1" fill="#4a5560" stroke="#1a2b3c" stroke-width="1"/>
    <line x1="128" y1="151" x2="152" y2="151" stroke="#0d9f8a" stroke-width="1.4"/>
    <line x1="128" y1="156" x2="150" y2="156" stroke="#1a2b3c" stroke-width="1"/>
    <line x1="128" y1="161" x2="148" y2="161" stroke="#1a2b3c" stroke-width="1"/>
    <text x="140" y="222" text-anchor="middle" fill="#5a6b7c" font-size="10">vue de dessus</text>

    <!-- Coupe inlay - WHITE background -->
    <rect x="255" y="94" width="200" height="140" rx="8" fill="#fff" stroke="#0d9f8a" stroke-width="2"/>
    <text x="355" y="112" text-anchor="middle" fill="#087a6a" font-size="11" font-weight="700">COUPE INLAY</text>

    <ellipse cx="355" cy="132" rx="58" ry="14" fill="none" stroke="#0d9f8a" stroke-width="3"/>
    <ellipse cx="355" cy="132" rx="42" ry="9" fill="none" stroke="#0d9f8a" stroke-width="2"/>
    <text x="355" y="158" text-anchor="middle" fill="#0c1b2a" font-size="11" font-weight="700">1. Antenne (bobine)</text>
    <text x="355" y="172" text-anchor="middle" fill="#5a6b7c" font-size="10">13,56 MHz / ISO 14443 A</text>

    <line x1="355" y1="178" x2="355" y2="188" stroke="#087a6a" stroke-width="2"/>
    <polygon points="355,192 349,184 361,184" fill="#087a6a"/>

    <!-- die on white -->
    <rect x="312" y="196" width="86" height="28" rx="2" fill="#fff" stroke="#0c1b2a" stroke-width="1.5"/>
    <rect x="320" y="201" width="70" height="18" rx="1" fill="#4a5560" stroke="#1a2b3c" stroke-width="1"/>
    <line x1="326" y1="207" x2="382" y2="207" stroke="#0d9f8a" stroke-width="1.4"/>
    <line x1="326" y1="212" x2="378" y2="212" stroke="#1a2b3c" stroke-width="1"/>
    <text x="355" y="238" text-anchor="middle" fill="#0c1b2a" font-size="11" font-weight="700">2. Die silicium</text>

    <line x1="162" y1="155" x2="255" y2="155" stroke="#c45c26" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="208" y="148" text-anchor="middle" fill="#c45c26" font-size="9" font-weight="700">meme die</text>

    <!-- Structure logique -->
    <text x="250" y="268" text-anchor="middle" fill="#5a6b7c" font-size="11" font-weight="700" letter-spacing="0.05em">STRUCTURE LOGIQUE (memoire)</text>

    <rect x="48" y="278" width="404" height="160" rx="8" fill="#f7f9fb" stroke="#c5d3df" stroke-width="1.5"/>
    <rect x="48" y="278" width="404" height="26" fill="#1a2b3c"/>
    <text x="90" y="296" fill="#fff" font-size="11" font-weight="700">Addr</text>
    <text x="200" y="296" fill="#fff" font-size="11" font-weight="700">Contenu</text>
    <text x="380" y="296" fill="#fff" font-size="11" font-weight="700">Acces</text>

    <text x="90" y="326" fill="#087a6a" font-size="12" font-weight="700">00-02</text>
    <text x="150" y="326" fill="#0c1b2a" font-size="12">UID + fabricant</text>
    <text x="380" y="326" fill="#c45c26" font-size="11" font-weight="700">RO</text>
    <line x1="58" y1="336" x2="442" y2="336" stroke="#e2ebf2"/>

    <text x="90" y="358" fill="#087a6a" font-size="12" font-weight="700">03</text>
    <text x="150" y="358" fill="#0c1b2a" font-size="12">CC (Capability Container)</text>
    <text x="380" y="358" fill="#5a6b7c" font-size="11">config</text>
    <line x1="58" y1="368" x2="442" y2="368" stroke="#e2ebf2"/>

    <rect x="48" y="374" width="404" height="34" fill="#e7f6f3"/>
    <text x="90" y="396" fill="#087a6a" font-size="12" font-weight="700">04+</text>
    <text x="150" y="390" fill="#0c1b2a" font-size="12" font-weight="700">Zone utilisateur NDEF</text>
    <text x="150" y="404" fill="#5a6b7c" font-size="10">URL, texte, Wi-Fi...</text>
    <text x="380" y="396" fill="#087a6a" font-size="11" font-weight="700">R/W</text>
    <line x1="58" y1="414" x2="442" y2="414" stroke="#e2ebf2"/>

    <text x="90" y="432" fill="#087a6a" font-size="12" font-weight="700">fin</text>
    <text x="150" y="432" fill="#0c1b2a" font-size="12">Locks / password</text>
    <text x="380" y="432" fill="#5a6b7c" font-size="11">protect</text>

    <text x="250" y="470" text-anchor="middle" fill="#5a6b7c" font-size="11" font-weight="700" letter-spacing="0.05em">APDU PC/SC</text>
    <rect x="48" y="478" width="404" height="44" rx="8" fill="#1a2b3c"/>
    <text x="250" y="496" text-anchor="middle" fill="#a8e6d8" font-family="ui-monospace,monospace" font-size="11">FF B0 ... lecture   |   FF D6 ... ecriture</text>
    <text x="250" y="512" text-anchor="middle" fill="#7eb6d9" font-size="10">pages memoire (pas SELECT AID)</text>
  </g>

  <!-- VS -->
  <g>
    <circle cx="500" cy="260" r="24" fill="#0d9f8a"/>
    <text x="500" y="266" text-anchor="middle" fill="#fff" font-family="Syne,sans-serif" font-size="13" font-weight="800">vs</text>
  </g>

  <!-- ========== RIGHT: EMV ========== -->
  <g>
    <rect x="524" y="16" width="452" height="520" rx="12" fill="#fff" stroke="#c5d3df" stroke-width="2"/>
    <rect x="524" y="16" width="452" height="44" rx="12" fill="#e3eef6"/>
    <rect x="524" y="44" width="452" height="16" fill="#e3eef6"/>
    <text x="750" y="44" text-anchor="middle" fill="#1e5f8a" font-family="Syne,sans-serif" font-size="17" font-weight="800">Puce paiement (EMV)</text>

    <text x="750" y="82" text-anchor="middle" fill="#5a6b7c" font-size="11" font-weight="700" letter-spacing="0.05em">VUE PHYSIQUE (carte + coupe)</text>

    <!-- Card -->
    <rect x="545" y="94" width="200" height="140" rx="8" fill="#1e5f8a"/>
    <rect x="545" y="94" width="200" height="30" rx="8" fill="#163f5c"/>
    <rect x="545" y="112" width="200" height="12" fill="#163f5c"/>
    <g transform="translate(565,140)">
      <rect width="66" height="52" rx="3" fill="#d4a84b" stroke="#8a6a20" stroke-width="1.5"/>
      <rect x="4" y="4" width="26" height="12" rx="1" fill="#f5e6b0"/>
      <rect x="36" y="4" width="26" height="12" rx="1" fill="#f5e6b0"/>
      <rect x="4" y="20" width="26" height="12" rx="1" fill="#f5e6b0"/>
      <rect x="36" y="20" width="26" height="12" rx="1" fill="#f5e6b0"/>
      <rect x="4" y="36" width="26" height="12" rx="1" fill="#f5e6b0"/>
      <rect x="36" y="36" width="26" height="12" rx="1" fill="#f5e6b0"/>
      <line x1="33" y1="4" x2="33" y2="48" stroke="#8a6a20" stroke-width="1.2"/>
      <line x1="4" y1="18" x2="62" y2="18" stroke="#8a6a20" stroke-width="1"/>
      <line x1="4" y1="34" x2="62" y2="34" stroke="#8a6a20" stroke-width="1"/>
    </g>
    <path d="M690 130 c20 0 36 16 36 42 s-16 42 -36 42" fill="none" stroke="#9ec9e6" stroke-width="2.5"/>
    <path d="M690 142 c12 0 20 10 20 30 s-8 30 -20 30" fill="none" stroke="#9ec9e6" stroke-width="1.8"/>
    <text x="645" y="222" text-anchor="middle" fill="#a8c8dc" font-size="10">module + antenne CL</text>

    <!-- Coupe module - WHITE -->
    <rect x="760" y="94" width="195" height="140" rx="8" fill="#fff" stroke="#1e5f8a" stroke-width="2"/>
    <text x="857" y="112" text-anchor="middle" fill="#1e5f8a" font-size="11" font-weight="700">COUPE MODULE</text>

    <rect x="785" y="122" width="145" height="26" rx="3" fill="#d4a84b" stroke="#8a6a20" stroke-width="1.2"/>
    <rect x="792" y="127" width="30" height="10" rx="1" fill="#f5e6b0"/>
    <rect x="828" y="127" width="30" height="10" rx="1" fill="#f5e6b0"/>
    <rect x="864" y="127" width="30" height="10" rx="1" fill="#f5e6b0"/>
    <rect x="900" y="127" width="22" height="10" rx="1" fill="#f5e6b0"/>
    <text x="857" y="164" text-anchor="middle" fill="#0c1b2a" font-size="11" font-weight="700">1. Plots contact (or)</text>
    <text x="857" y="177" text-anchor="middle" fill="#5a6b7c" font-size="10">ISO 7816 - ce qu'on voit</text>

    <line x1="857" y1="182" x2="857" y2="190" stroke="#1e5f8a" stroke-width="2"/>
    <polygon points="857,194 851,186 863,186" fill="#1e5f8a"/>

    <!-- die on white -->
    <rect x="814" y="198" width="86" height="28" rx="2" fill="#fff" stroke="#0c1b2a" stroke-width="1.5"/>
    <rect x="822" y="203" width="70" height="18" rx="1" fill="#4a5560" stroke="#1a2b3c" stroke-width="1"/>
    <line x1="828" y1="209" x2="884" y2="209" stroke="#0d9f8a" stroke-width="1.4"/>
    <line x1="828" y1="214" x2="880" y2="214" stroke="#1a2b3c" stroke-width="1"/>
    <text x="857" y="241" text-anchor="middle" fill="#0c1b2a" font-size="11" font-weight="700">2. Die silicium</text>

    <line x1="631" y1="160" x2="760" y2="160" stroke="#c45c26" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="695" y="153" text-anchor="middle" fill="#c45c26" font-size="9" font-weight="700">meme die</text>

    <text x="750" y="268" text-anchor="middle" fill="#5a6b7c" font-size="11" font-weight="700" letter-spacing="0.05em">STRUCTURE LOGIQUE (smart card)</text>

    <rect x="548" y="278" width="404" height="160" rx="8" fill="#f7f9fb" stroke="#c5d3df" stroke-width="1.5"/>
    <rect x="566" y="292" width="368" height="28" rx="4" fill="#1e5f8a"/>
    <text x="750" y="311" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Applications EMV (AID Visa / MC...)</text>
    <rect x="566" y="328" width="368" height="28" rx="4" fill="#2a6f9a"/>
    <text x="750" y="347" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">OS carte (JCOP / Multos / native)</text>
    <rect x="566" y="364" width="368" height="28" rx="4" fill="#3d7fa8"/>
    <text x="750" y="383" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Secrets : cles, certificats, ATC</text>
    <rect x="566" y="400" width="368" height="28" rx="4" fill="#0d9f8a"/>
    <text x="750" y="419" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Interface 14443 + contact 7816</text>

    <text x="750" y="470" text-anchor="middle" fill="#5a6b7c" font-size="11" font-weight="700" letter-spacing="0.05em">APDU METIER</text>
    <rect x="548" y="478" width="404" height="44" rx="8" fill="#1a2b3c"/>
    <text x="750" y="496" text-anchor="middle" fill="#a8e6d8" font-family="ui-monospace,monospace" font-size="11">SELECT AID  /  GPO  /  GENERATE AC</text>
    <text x="750" y="512" text-anchor="middle" fill="#7eb6d9" font-size="10">application paiement (pas pages memoire)</text>
  </g>

  <!-- ========== LEGENDE DIE ========== -->
  <rect x="24" y="552" width="952" height="72" rx="10" fill="#fff" stroke="#0d9f8a" stroke-width="2"/>
  <rect x="40" y="566" width="36" height="28" rx="2" fill="#fff" stroke="#0c1b2a" stroke-width="1.5"/>
  <rect x="46" y="571" width="24" height="18" rx="1" fill="#4a5560"/>
  <line x1="50" y1="577" x2="66" y2="577" stroke="#0d9f8a" stroke-width="1.2"/>
  <text x="92" y="578" fill="#0c1b2a" font-family="Syne,sans-serif" font-size="14" font-weight="800">Die silicium</text>
  <text x="92" y="598" fill="#243447" font-size="13">= pastille de silicium (circuit integre) : le " cerveau " de la puce, grave en usine.</text>
  <text x="92" y="616" fill="#5a6b7c" font-size="12">Tag : die = memoire seule.  Carte EMV : die = OS + apps + secrets (sous les plots or).</text>

  <!-- ========== SYNTHESE ========== -->
  <rect x="24" y="640" width="952" height="64" rx="10" fill="#fff" stroke="#c5d3df" stroke-width="2"/>
  <text x="500" y="664" text-anchor="middle" fill="#0c1b2a" font-family="Syne,sans-serif" font-size="13" font-weight="800">Point commun et difference</text>
  <rect x="50" y="676" width="280" height="18" rx="4" fill="#e7f6f3"/>
  <text x="190" y="689" text-anchor="middle" fill="#087a6a" font-size="11" font-weight="700">Meme radio : ISO 14443</text>
  <rect x="360" y="676" width="280" height="18" rx="4" fill="#eef3f7"/>
  <text x="500" y="689" text-anchor="middle" fill="#2f4858" font-size="11" font-weight="700">Meme canal APDU / PC/SC</text>
  <rect x="670" y="676" width="280" height="18" rx="4" fill="#e3eef6"/>
  <text x="810" y="689" text-anchor="middle" fill="#1e5f8a" font-size="11" font-weight="700">Memoire vs application securisee</text>
</svg>
