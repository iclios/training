<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="Ajouter une carte Google Wallet en quatre etapes">
  <rect width="1000" height="320" fill="#f7f9fb"/>
  <!-- 1 -->
  <rect x="20" y="40" width="220" height="240" rx="28" fill="#2f4858"/>
  <rect x="40" y="70" width="180" height="180" rx="12" fill="#fff7f0"/>
  <text x="130" y="105" text-anchor="middle" fill="#c45c26" font-family="Syne,sans-serif" font-size="13" font-weight="800">Google Wallet</text>
  <text x="130" y="128" text-anchor="middle" fill="#5a6b7c" font-size="11">app dans le tiroir</text>
  <circle cx="130" cy="165" r="26" fill="#c45c26"/>
  <text x="130" y="171" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">+</text>
  <text x="130" y="215" text-anchor="middle" fill="#5a6b7c" font-size="11">Ajouter à Wallet</text>
  <text x="130" y="300" text-anchor="middle" fill="#c45c26" font-family="Syne,sans-serif" font-size="12" font-weight="700">1 · Ouvrir l’app</text>
  <!-- 2 -->
  <rect x="270" y="40" width="220" height="240" rx="28" fill="#2f4858"/>
  <rect x="290" y="70" width="180" height="180" rx="12" fill="#fff"/>
  <rect x="310" y="95" width="140" height="70" rx="10" fill="#c45c26"/>
  <text x="380" y="125" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Carte de paiement</text>
  <text x="380" y="145" text-anchor="middle" fill="#fff7f0" font-size="10">scan / saisie</text>
  <text x="380" y="200" text-anchor="middle" fill="#5a6b7c" font-size="11">Enregistrer</text>
  <text x="380" y="220" text-anchor="middle" fill="#5a6b7c" font-size="11">et continuer</text>
  <text x="380" y="300" text-anchor="middle" fill="#c45c26" font-family="Syne,sans-serif" font-size="12" font-weight="700">2 · Nouvelle carte</text>
  <!-- 3 -->
  <rect x="520" y="40" width="220" height="240" rx="28" fill="#2f4858"/>
  <rect x="540" y="70" width="180" height="180" rx="12" fill="#fff"/>
  <text x="630" y="120" text-anchor="middle" fill="#c45c26" font-size="13" font-weight="800">Banque</text>
  <text x="630" y="145" text-anchor="middle" fill="#5a6b7c" font-size="11">Accepter CGU</text>
  <text x="630" y="165" text-anchor="middle" fill="#5a6b7c" font-size="11">puis valider (OTP)</text>
  <rect x="570" y="185" width="120" height="36" rx="8" fill="#fff7f0" stroke="#c45c26" stroke-width="2"/>
  <text x="630" y="209" text-anchor="middle" fill="#c45c26" font-size="14" font-weight="700">· · · ·</text>
  <text x="630" y="300" text-anchor="middle" fill="#c45c26" font-family="Syne,sans-serif" font-size="12" font-weight="700">3 · Valider émetteur</text>
  <!-- 4 -->
  <rect x="770" y="40" width="210" height="240" rx="28" fill="#2f4858"/>
  <rect x="790" y="70" width="170" height="180" rx="12" fill="#fff7f0"/>
  <rect x="810" y="100" width="130" height="80" rx="10" fill="#c45c26"/>
  <text x="875" y="135" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">TOKEN</text>
  <text x="875" y="155" text-anchor="middle" fill="#fff7f0" font-size="10">HCE · LUK</text>
  <text x="875" y="210" text-anchor="middle" fill="#5a6b7c" font-size="11">NFC défaut =</text>
  <text x="875" y="228" text-anchor="middle" fill="#5a6b7c" font-size="11">Google Wallet</text>
  <text x="875" y="300" text-anchor="middle" fill="#c45c26" font-family="Syne,sans-serif" font-size="12" font-weight="700">4 · Prêt au tap</text>
</svg>
